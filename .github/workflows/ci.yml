name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --locked

      - name: test
        run: cargo test --locked

  # Line coverage via cargo-llvm-cov; lcov report is uploaded as an artifact.
  # No --fail-under-lines gate yet: the crate currently has no tests (0%).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info

      - name: coverage summary
        run: cargo llvm-cov report --summary-only

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  # Confirm the project still builds on its declared MSRV (Cargo.toml rust-version).
  msrv:
    name: build on MSRV (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
